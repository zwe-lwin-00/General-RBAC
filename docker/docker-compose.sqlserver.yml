# SQL Server backend for the sample API.
# docker compose -f docker-compose.yml -f docker/docker-compose.sqlserver.yml up --build

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Rbac_Dev_Passw0rd!}
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      retries: 20
      start_period: 40s

  api:
    environment:
      ConnectionStrings__SqlServer: Server=sqlserver,1433;Database=Rbac;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Rbac_Dev_Passw0rd!};TrustServerCertificate=True;Encrypt=True
    depends_on:
      sqlserver:
        condition: service_healthy
