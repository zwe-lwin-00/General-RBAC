name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test Rbac.sln --configuration Release

  react:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
        working-directory: packages/rbac-react
      - run: npm install
        working-directory: samples/Rbac.Sample.React
      - run: npm run build
        working-directory: samples/Rbac.Sample.React

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Start stack
        run: docker compose up -d
      - name: Smoke test
        run: ./scripts/docker-smoke.sh
      - name: Dump logs on failure
        if: failure()
        run: docker compose ps -a && docker compose logs
      - name: Stop stack
        if: always()
        run: docker compose down -v
